<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xenon Edge Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at center, #132330 0%, #071014 48%, #020607 100%); font-family: Orbitron, ui-sans-serif, sans-serif; }
    .timer { position: relative; width: min(96vw, 1000px); min-height: min(52vw, 540px); padding: 4.5% 7%; overflow: hidden; border: 4px solid #9aafbd; clip-path: polygon(2% 0, 98% 0, 100% 5%, 100% 95%, 98% 100%, 2% 100%, 0 95%, 0 5%); background: linear-gradient(150deg, rgba(22,38,48,.96), rgba(2,8,11,.98) 20%, rgba(4,11,15,.98) 84%, rgba(23,39,48,.92)); box-shadow: inset 0 0 0 2px #273d4b, inset 0 0 32px #9bdfff1c, 0 0 38px #94dfff25; }
    .timer::before, .timer::after { content: ''; position: absolute; left: 4%; right: 4%; height: 2px; background: linear-gradient(90deg, transparent, #d7edff 12%, #93c5e9 48%, #d7edff 88%, transparent); box-shadow: 0 0 9px #a9dcff; }
    .timer::before { top: 3.5%; } .timer::after { bottom: 3.5%; }
    .top { display: flex; justify-content: space-between; align-items: center; color: #c4e4ff; font-size: clamp(10px, 1.6vw, 18px); letter-spacing: .22em; }
    .mark { font-size: 1.55em; font-weight: 700; letter-spacing: -.2em; margin-right: .7em; }
    .content { display: grid; grid-template-columns: 1fr 3.4fr 1fr; align-items: center; gap: 4%; margin-top: 10%; }
    .control { border: 0; color: #e7f5ff; background: transparent; font: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: .16em; font-size: clamp(10px, 1.35vw, 15px); }
    .round { width: clamp(76px, 12vw, 126px); aspect-ratio: 1; margin: auto auto 16px; display: grid; place-items: center; border: 3px solid #bbdbef; border-radius: 50%; outline: 1px solid #496474; outline-offset: 10px; background: radial-gradient(circle, #152836 0, #071117 64%, #263e4d 66%, #b8cbd6 73%, #101c24 79%); box-shadow: inset 0 0 20px #9ed8ff55, 0 0 18px #a6dfff32; font-size: clamp(28px, 4.5vw, 52px); text-shadow: 0 0 13px #e0f4ff; }
    .play { margin-left: .1em; width: 0; height: 0; border-top: .45em solid transparent; border-bottom: .45em solid transparent; border-left: .7em solid currentColor; }
    .pause { display: flex; gap: .25em; } .pause i { width: .18em; height: .85em; background: currentColor; border-radius: 2px; }
    .display { text-align: center; position: relative; padding: 8% 0 10%; border-radius: 50%; background: radial-gradient(ellipse, transparent 44%, #8fceff0e 45%, transparent 60%); }
    .labels { display: grid; grid-template-columns: repeat(3,1fr); padding: 0 12%; color: #cdeaff; font-size: clamp(9px, 1.5vw, 16px); letter-spacing: .13em; }
    .time { margin-top: 2%; color: #f1f9ff; font-size: clamp(34px, 8.2vw, 90px); line-height: 1; font-weight: 600; letter-spacing: .025em; text-shadow: 0 0 4px #fff, 0 0 13px #87ccff, 0 0 28px #75bfff99; white-space: nowrap; }
    .caption { margin-top: 8%; color: #c3e5ff; letter-spacing: .2em; font-size: clamp(9px, 1.35vw, 15px); }
    .caption::before, .caption::after { content: ''; display: inline-block; vertical-align: middle; width: 15%; max-width: 70px; height: 1px; margin: 0 1em; background: #bde6ff; box-shadow: 0 0 5px #bde6ff; }
    .reset { position: absolute; right: 7%; bottom: 7%; border: 1px solid #7da4bc; padding: .55em .8em; color: #b9ddf5; background: #0b1921aa; font: 500 clamp(8px, 1vw, 11px) Orbitron, sans-serif; letter-spacing: .12em; cursor: pointer; }
    .control:focus-visible, .reset:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    @media (max-width: 550px) { .timer { width: 100vw; min-height: 62vw; border-width: 2px; } .content { margin-top: 7%; gap: 2%; } .round { outline-offset: 5px; margin-bottom: 8px; } .caption { margin-top: 5%; } .caption::before, .caption::after { margin: 0 .5em; } }
  </style>
</head>
<body>
  <main class="timer" aria-label="Xenon Edge 타이머">
    <div class="top"><span><span class="mark">///</span>XENON EDGE</span><span>TIMER <span class="mark">///</span></span></div>
    <section class="content">
      <button class="control" id="start" aria-label="타이머 시작"><span class="round"><span class="play"></span></span>START</button>
      <div class="display" aria-live="polite"><div class="labels"><span>HOUR</span><span>MIN</span><span>SEC</span></div><div class="time" id="time">01:30:00</div><div class="caption">TIMER</div></div>
      <button class="control" id="pause" aria-label="타이머 일시정지"><span class="round"><span class="pause"><i></i><i></i></span></span>PAUSE</button>
    </section>
    <button class="reset" id="reset">RESET</button>
  </main>
  <script>
    const initial = 90 * 60; let remaining = initial, interval;
    const time = document.querySelector('#time');
    function render() { const h = Math.floor(remaining / 3600), m = Math.floor(remaining % 3600 / 60), s = remaining % 60; time.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':'); }
    function stop() { clearInterval(interval); interval = undefined; }
    document.querySelector('#start').onclick = () => { if (interval || remaining === 0) return; interval = setInterval(() => { remaining--; render(); if (!remaining) stop(); }, 1000); };
    document.querySelector('#pause').onclick = stop;
    document.querySelector('#reset').onclick = () => { stop(); remaining = initial; render(); };
  </script>


</body></html>
